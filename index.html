<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Tracker</title>
  <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore.js"></script>
</head>
<body>
  <h1>Goal Tracker</h1>

  <!-- Formulário de Registro -->
  <form id="registerForm">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Senha" required>
    <input type="text" id="username" placeholder="Nome de usuário" required>
    <input type="text" id="name" placeholder="Nome completo" required>
    <button type="submit">Registrar</button>
  </form>

  <!-- Formulário de Login -->
  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Senha" required>
    <button type="submit">Entrar</button>
  </form>

  <!-- Botão para deslogar -->
  <button id="logoutBtn">Sair</button>

  <!-- Botão para marcar jogo como assistido -->
  <button id="markGameBtn">Marcar jogo como assistido</button>

  <!-- Botão para carregar os jogos assistidos -->
  <button id="loadWatchedGamesBtn">Carregar jogos assistidos</button>

  <script src="script.js"></script>
</body>
</html>
